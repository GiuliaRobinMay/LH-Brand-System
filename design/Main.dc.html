<x-dc>

<div style="width: 1440px; height: 900px; background: #f4f6f8; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: center; padding: 0 110px;">

    <div style="display: flex; gap: 16px; align-items: center; padding-top: 8px;">

      <div style="display: inline-flex; align-items: center; height: 68px; padding: 0 38px; background: #fdcc0a; color: #0e1a2b; font-size: 21px; font-weight: 700; border-radius: 999px;">See what's free</div>
